name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:worker

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://digest:digest@localhost:5432/digest
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-secret-uniquement-pour-les-tests-e2e
      SMTP_URL: smtp://localhost:1025
      ENCRYPTION_KEY: Y2ktZW5jcnlwdGlvbi1rZXktMzItb2N0ZXRzLW9rISE=
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait db mailpit
      - run: pnpm db:deploy
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Configuration de production valide
        run: docker compose -f compose.yaml -f deploy/compose.prod.yaml config --quiet
        env:
          DOMAIN: digest.example.com
          POSTGRES_PASSWORD: ci
          BETTER_AUTH_SECRET: ci
          ENCRYPTION_KEY: ci
          SMTP_URL: smtp://smtp.example.com:587
          MAIL_FROM: Digest <digest@example.com>
      - run: docker compose build
      - run: docker compose up -d
      - name: Page d'accueil et santé
        run: |
          curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3000/api/health
          curl --fail --silent http://localhost:3000/ | grep -q "Digest"
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
          test "$(docker compose ps worker --format '{{.State}}')" = "running"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
