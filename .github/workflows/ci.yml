name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:worker

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker compose build
      - run: docker compose up -d
      - name: Page d'accueil et santé
        run: |
          curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3000/api/health
          curl --fail --silent http://localhost:3000/ | grep -q "Digest"
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
          test "$(docker compose ps worker --format '{{.State}}')" = "running"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
