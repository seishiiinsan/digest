name: digest

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-digest}:${POSTGRES_PASSWORD:-digest}@db:5432/${POSTGRES_DB:-digest}
  APP_URL: ${APP_URL:-http://localhost:3000}
  # Valeur de démo : à remplacer sur tout serveur accessible (openssl rand -base64 32).
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-digest-local-secret-a-remplacer-en-production}
  # Clé maître de chiffrement des clés API et webhooks. Démo uniquement : à remplacer (openssl rand -base64 32).
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-ZGlnZXN0LWRlbW8tYS1yZW1wbGFjZXItZW4tcHJvZCE=}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-Digest <digest@localhost>}
  PASSWORD_BREACH_CHECK: ${PASSWORD_BREACH_CHECK:-true}
  SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}

# Une seule image pour web, worker et migrations.
x-app: &app
  image: ${DIGEST_IMAGE:-digest:local}
  build:
    context: .
    target: app
  environment: *app-env

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digest}
      POSTGRES_DB: ${POSTGRES_DB:-digest}
    # Exposée sur l'hôte en local uniquement, pour `pnpm dev`.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Boîte mail de test : les emails envoyés sont lisibles sur http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"

  migrate:
    <<: *app
    working_dir: /app/migrate
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    <<: *app
    command: ["node", "--enable-source-maps", "worker/worker.mjs"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
